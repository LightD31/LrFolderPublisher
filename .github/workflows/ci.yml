name: CI

on:
  push:
    branches-ignore: [main] # main is tested by the Release workflow
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: for f in FolderPublisher.lrplugin/*.lua tests/*.lua; do luac5.1 -p "$f"; done
      - name: Unit tests
        run: lua5.1 tests/run.lua
      - name: Integration tests
        run: lua5.1 tests/integration.lua
      - name: Translations
        run: python3 tools/i18n.py check
      - name: Build
        id: build
        run: echo "version=$(tools/build.sh)" >> "$GITHUB_OUTPUT"
      - name: Upload plug-in
        uses: actions/upload-artifact@v4
        with:
          name: FolderPublisher-${{ steps.build.outputs.version }}-${{ github.sha }}
          path: dist/FolderPublisher.lrplugin.zip
